[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwatch"
version = "0.1.0"
description = "Drift monitoring that separates drift worth acting on from drift worth ignoring"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
driftwatch = "driftwatch.cli:main"

[tool.setuptools.packages.find]
include = ["driftwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
